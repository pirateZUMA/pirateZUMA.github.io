<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photography Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, 
                #FFD700 0%, 
                #FFA500 25%, 
                #FF4500 50%, 
                #FF1493 75%, 
                #9370DB 100%);
            min-height: 100vh;
            padding: 20px;
        }

        nav {
            display: flex;
            justify-content: flex-end;
            gap: 30px;
            padding: 20px 40px;
            margin-bottom: 40px;
        }

        nav a {
            color: #000;
            text-decoration: none;
            font-size: 28px;
            font-weight: bold;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        nav a:hover {
            transform: scale(1.1);
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #fff;
            font-size: 48px;
            margin-bottom: 50px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 5px solid #000;
            border-radius: 10px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            aspect-ratio: 4/3;
            border: 3px solid #000;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover {
            transform: scale(1.05);
            z-index: 10;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: #fff;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            nav {
                gap: 20px;
                padding: 20px;
            }

            nav a {
                font-size: 24px;
            }

            h1 {
                font-size: 32px;
            }
        }

        @media (max-width: 480px) {
            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="gallery.html">Gallery</a>
        <a href="about.html">About</a>
    </nav>

    <div class="container">
        <h1>Featured Landscapes</h1>
        
        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800" alt="Mountain reflection">
            </div>
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1511593358241-7eea1f3c84e5?w=800" alt="Forest lake">
            </div>
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800" alt="Sunset lake">
            </div>
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800" alt="Purple sunset lake">
            </div>
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800" alt="Green valley">
            </div>
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1501594907352-04cda38ebc29?w=800" alt="Flower path">
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 My Photography Portfolio. All rights reserved.</p>
    </footer>
</body>
</html>
